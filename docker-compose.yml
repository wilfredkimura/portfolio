services:
  portfolio-server:
    build: ./server
    restart: always
    ports:
      - "5000:5000" # Crucial for NPM and curl to work
    volumes:
      - ./server/database.sqlite:/app/database.sqlite
    environment:
      - NODE_ENV=production
      - PORT=5000

  portfolio-client:
    build: ./client
    restart: always
    ports:
      - "8085:80"
    depends_on:
      - portfolio-server
